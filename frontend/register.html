<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — MoodJournal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <h1 class="auth-title">MoodJournal</h1>
          <p class="auth-subtitle">Create your account</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="username" class="required">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="3-30 characters, letters, numbers, -, _, ."
              required
            />
            <div id="usernameHint" class="text-sm text-muted" style="margin-top: 0.25rem"></div>
          </div>

          <div class="form-group">
            <label for="password" class="required">Password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 8 characters with a letter and number"
                required
              />
              <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility(this)">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="icon-eye-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-3.09 4.24"></path><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"></path><path d="M2 2l20 20"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path></svg>
              </button>
            </div>
            <div id="passwordHint" class="text-sm text-muted" style="margin-top: 0.25rem"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="required">Confirm Password</label>
            <div class="password-field">
              <input type="password" id="confirmPassword" name="confirmPassword" required />
              <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility(this)">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="icon-eye-off" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-3.09 4.24"></path><path d="M6.61 6.61A13.53 13.53 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"></path><path d="M2 2l20 20"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path></svg>
              </button>
            </div>
          </div>

          <div id="errorAlert" class="hidden"></div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
        </form>

        <div class="auth-link">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script>
      const api = new ApiClient();

      // Redirect to index if already authenticated
      if (api.isAuthenticated()) {
        window.location.href = "index.html";
      }

      const form = document.getElementById("registerForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const errorAlert = document.getElementById("errorAlert");

      // Real-time validation hints
      usernameInput.addEventListener("input", () => {
        const username = usernameInput.value;
        const hint = document.getElementById("usernameHint");

        if (username.length < 3) {
          hint.textContent = "At least 3 characters";
          hint.style.color = "var(--color-warning)";
        } else if (username.length > 30) {
          hint.textContent = "Maximum 30 characters";
          hint.style.color = "var(--color-danger)";
        } else if (!/^[a-z0-9_.-]+$/.test(username.toLowerCase())) {
          hint.textContent = "Only letters, numbers, -, _, . allowed";
          hint.style.color = "var(--color-danger)";
        } else {
          hint.textContent = "Valid username";
          hint.style.color = "var(--color-success)";
        }
      });

      passwordInput.addEventListener("input", () => {
        const password = passwordInput.value;
        const hint = document.getElementById("passwordHint");

        if (password.length < 8) {
          hint.textContent = "At least 8 characters";
          hint.style.color = "var(--color-warning)";
        } else if (!/[a-zA-Z]/.test(password)) {
          hint.textContent = "Must include at least one letter";
          hint.style.color = "var(--color-warning)";
        } else if (!/[0-9]/.test(password)) {
          hint.textContent = "Must include at least one number";
          hint.style.color = "var(--color-warning)";
        } else {
          hint.textContent = "Strong password";
          hint.style.color = "var(--color-success)";
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = usernameInput.value;
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        errorAlert.classList.add("hidden");

        // Client-side validation
        if (password !== confirmPassword) {
          errorAlert.className = "alert alert-danger";
          errorAlert.innerHTML = `
            <div>Passwords do not match.</div>
          `;
          errorAlert.classList.remove("hidden");
          return;
        }

        try {
          await register(username, password);
          window.location.href = "index.html";
        } catch (err) {
          console.error("Registration failed:", err);
          const message =
            err.code === "CONFLICT"
              ? "That username is already taken. Please choose another."
              : err.message || "Registration failed. Please try again.";

          errorAlert.className = "alert alert-danger";
          errorAlert.innerHTML = `
            <div style="flex: 1">${escapeHtml(message)}</div>
          `;
          errorAlert.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
